<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>My Profile - Skill Exchange</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .profile-card {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 22px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .logo {
            font-size: 28px;

            font-weight: bold;

            color: #5b4bc4;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;

            margin-bottom: 25px;
        }

        h2 {
            color: #333;

            margin-bottom: 25px;
        }

        .profile-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 25px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .profile-button:hover {
            opacity: 0.9;

            transform: translateY(-2px);
        }

        .back {
            margin-top: 25px;
        }

        .back a {
            color: #5b4bc4;

            text-decoration: none;

            font-weight: bold;
        }

        .back a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="profile-card">

        <div class="logo">
            Skill Exchange
        </div>

        <div class="subtitle">
            Manage and view your profile
        </div>

        <h2>My Profile</h2>

        <form action="profile" method="get">

            <input
                class="profile-button"
                type="submit"
                value="View My Profile"
            >

        </form>

        <div class="back">

            <a href="dashboard.html">
                Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
