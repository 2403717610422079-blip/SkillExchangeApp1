<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Skill Exchange Application</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 90%;
            max-width: 600px;

            background: white;

            padding: 50px 40px;

            border-radius: 25px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;

            color: #5b4bc4;

            margin-bottom: 15px;
        }

        h1 {
            color: #333;

            font-size: 28px;

            margin-bottom: 15px;
        }

        .description {
            color: #777;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 35px;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-block;

            padding: 13px 30px;

            border-radius: 25px;

            text-decoration: none;

            font-weight: bold;

            font-size: 16px;

            transition: 0.3s;
        }

        .register {
            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;
        }

        .login {
            background: white;

            color: #5b4bc4;

            border: 2px solid #667eea;
        }

        .button:hover {
            transform: translateY(-3px);

            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer {
            margin-top: 35px;

            color: #999;

            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            Skill Exchange
        </div>

        <h1>
            Welcome to Skill Exchange Application
        </h1>

        <p class="description">
            Learn a new skill, share your knowledge,
            and connect with other users through skill exchange.
        </p>

        <div class="buttons">

            <a class="button register" href="register.html">
                Register
            </a>

            <a class="button login" href="login.html">
                Login
            </a>

        </div>

        <div class="footer">
            Learn Skills. Share Knowledge. Exchange Skills.
        </div>

    </div>

</body>

</html>
