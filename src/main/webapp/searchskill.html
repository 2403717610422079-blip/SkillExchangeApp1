<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Search Skills - Skill Exchange</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .search-card {
            width: 90%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 22px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #5b4bc4;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        h2 {
            text-align: center;

            color: #333;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #555;
        }

        input[type="text"] {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input[type="text"]:focus {

            border-color: #667eea;

            box-shadow: 0 0 5px rgba(102,126,234,0.3);
        }

        input[type="submit"] {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 25px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        input[type="submit"]:hover {

            opacity: 0.9;

            transform: translateY(-2px);
        }

        .back {

            text-align: center;

            margin-top: 25px;
        }

        .back a {

            color: #5b4bc4;

            text-decoration: none;

            font-weight: bold;
        }

        .back a:hover {

            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="search-card">

        <div class="logo">
            Skill Exchange
        </div>

        <div class="subtitle">
            Find users who can teach the skills you need
        </div>

        <h2>Search Skills</h2>

        <form action="searchskill" method="get">

            <label>Enter Skill Name</label>

            <input
                type="text"
                name="skill_name"
                placeholder="Example: Java"
                required
            >

            <input
                type="submit"
                value="Search"
            >

        </form>

        <div class="back">

            <a href="dashboard.html">
                Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
